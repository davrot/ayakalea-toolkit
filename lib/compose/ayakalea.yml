---
# Ayakalea application container.
# The app is only reachable inside ayaka-network (aliases: overleaf, sharelatex).
# Host port publishing is handled by nginx.yml (TLS proxy) or ayakalea-ports.yml
# (direct access, when the proxy is disabled).
services:
  ayakalea:
    image: "${AYAKALEA_IMAGE}"
    container_name: ayakalea
    hostname: ayakalea
    restart: always
    env_file:
      - ${CONFIG_DIR}/variables.env
    environment:
      OVERLEAF_MONGO_URL: "${OVERLEAF_MONGO_URL}"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"
      OVERLEAF_REDIS_HOST: "${OVERLEAF_REDIS_HOST}"
      V1_HISTORY_URL: "http://ayakalea:3100/api"
      GIT_BRIDGE_ENABLED: "${GIT_BRIDGE_ENABLED}"
      GIT_BRIDGE_HOST: "git-bridge"
      GIT_BRIDGE_PORT: "8000"
      # Conversion bridge images — the app starts these containers itself via
      # the Docker socket when ENABLE_PANDOC_CONVERSIONS / ENABLE_PNG2PDF_CONVERSIONS
      # are on (config/variables.env). Image names: config/images.env.
      PANDOC_IMAGE: "${PANDOC_IMAGE}"
      PNG2PDF_IMAGE: "${PNG2PDF_IMAGE}"
      CONVERSION_SANDBOX_IMAGE: "${PDFTOCAIRO_IMAGE}"
    volumes:
      - "${OVERLEAF_DATA_PATH}:/var/lib/overleaf:z"
    expose:
      - "80"
      - "3000"
      - "3100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsI --connect-timeout 10 http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s
    networks:
      ayaka-network:
        aliases:
          - overleaf
          - sharelatex

networks:
  ayaka-network:
    external: true
