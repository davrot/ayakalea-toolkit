---
# Optional set: real LanguageTool server (v2 API on :8010).
# Image: ghcr.io/ayaka-notes/languagetool (fallback erikvl87/languagetool) —
# see config/images.env. The app reaches it as http://languagetool:8010.
services:
  languagetool:
    image: "${LANGUAGE_TOOL_IMAGE}"
    container_name: languagetool
    hostname: languagetool
    restart: always
    environment:
      Java_Xms: "${LANGUAGE_TOOL_JAVA_XMS}"
      Java_Xmx: "${LANGUAGE_TOOL_JAVA_XMX}"
      # N-gram language models (run lib/tools/download-ngrams.sh to populate;
      # the server still works without them — just fewer suggestions).
      langtool_languageModel: /ngrams
    volumes:
      - "${LANGUAGE_TOOL_NGRAMS_DIR}:/ngrams:ro"
    expose:
      - "8010"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --timeout=5 http://127.0.0.1:8010/v2/languages 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - ayaka-network

  ayakalea:
    # App-side gate + endpoint (Settings → Spelling and Language)
    environment:
      LANGUAGE_TOOL_ENABLED: "true"
      LANGUAGE_TOOL_HOST: "languagetool"
      LANGUAGE_TOOL_PORT: "8010"

networks:
  ayaka-network:
    external: true
