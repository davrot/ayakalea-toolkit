---
# nginx TLS proxy — the only service that surfaces to the world (80/443).
services:
  nginx:
    image: "${NGINX_IMAGE}"
    container_name: nginx
    hostname: nginx
    restart: always
    volumes:
      - "${TLS_PRIVATE_KEY_PATH}:/certs/nginx_key.pem:ro"
      - "${TLS_CERTIFICATE_PATH}:/certs/nginx_certificate.pem:ro"
      - "${NGINX_CONFIG_PATH}:/etc/nginx/nginx.conf:ro"
    ports:
      - "${NGINX_HTTP_LISTEN_IP}:${NGINX_HTTP_PORT}:80"
      - "${NGINX_TLS_LISTEN_IP}:${TLS_PORT}:443"
    healthcheck:
      # nginx:alpine has no curl/openssl; nc is present. Verify both listeners
      # are accepting connections (nginx exits at startup on bad config, so a
      # running process with live listeners is healthy).
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      ayakalea:
        condition: service_healthy
    networks:
      - ayaka-network

  ayakalea:
    environment:
      OVERLEAF_SECURE_COOKIE: "${OVERLEAF_SECURE_COOKIE}"
      OVERLEAF_TRUSTED_PROXY_IPS: "${OVERLEAF_TRUSTED_PROXY_IPS}"

networks:
  ayaka-network:
    external: true
