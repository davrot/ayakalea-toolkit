---
# Optional set: prometheus-probe-grafana — self-contained Prometheus + Grafana
# + exporter monitoring stack for the toolkit deployment.
#   * instance-sensor — Overleaf instance statistics as live gauges
#   * mongo/redis probes + mongodb/redis exporters
#   * node-exporter (host CPU/RAM/disk; mounts / read-only)
#   * prometheus (TSDB + alert rules) → ${PROMETHEUS_LISTEN_IP}:${PROMETHEUS_PORT}
#   * grafana (UI + provisioned datasource/dashboards) → ${GRAFANA_LISTEN_IP}:${GRAFANA_PORT}
# The stack joins ayaka-network, so it reaches mongo/redis/overleaf by name.
# Grafana admin password: set GRAFANA_ADMIN_PASSWORD in config/overleaf.rc
# (generated by bin/init when this set is enabled).
services:
  instance-sensor:
    image: "${INSTANCE_SENSOR_IMAGE}"
    container_name: instance-sensor
    hostname: instance-sensor
    restart: always
    environment:
      MONGO_URL: "mongodb://mongo:27017/${MONGO_DB}"
      REDIS_ADDR: "redis://redis:6379"
      FILESTORE_DATA_DIR: /hostdata/filestore
      SEGMENTATION: "true"
      ACTIVE_WINDOW_HOURS: "24"
      PROBE_TIMEOUT_MS: "8000"
      COLLECT_TIMEOUT_MS: "20000"
      PORT: "9464"
    expose:
      - "9464"
    volumes:
      # Host path of the filestore data dir (auto-derived to the SeaweedFS
      # data path when SEAWEEDFS_ENABLED; /dev/null ⇒ reports 0 bytes).
      - "${INSTANCE_SENSOR_FILESTORE_DIR}:/hostdata/filestore:ro"
    depends_on:
      mongo-probe:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://127.0.0.1:9464/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ayaka-network

  mongo-probe:
    image: "${MONGO_IMAGE}"
    container_name: mongo-probe
    hostname: mongo-probe
    restart: always
    command: ["sh", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host mongo --port 27017 --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ayaka-network

  mongodb-exporter-probe:
    image: "${PROBE_IMAGE}"
    container_name: mongodb-exporter-probe
    hostname: mongodb-exporter-probe
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://mongodb-exporter:9216/metrics >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    entrypoint: ["sh", "-c", "sleep infinity"]
    networks:
      - ayaka-network

  redis-exporter-probe:
    image: "${PROBE_IMAGE}"
    container_name: redis-exporter-probe
    hostname: redis-exporter-probe
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://redis-exporter:9121/metrics >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    entrypoint: ["sh", "-c", "sleep infinity"]
    networks:
      - ayaka-network

  mongodb-exporter:
    image: "${MONGODB_EXPORTER_IMAGE}"
    container_name: mongodb-exporter
    hostname: mongodb-exporter
    restart: always
    command:
      - "--mongodb.uri=mongodb://mongo:27017/${MONGO_DB}"
      - "--collector.diagnosticdata"
      - "--collector.dbstats"
      - "--collector.dbstatsfreestorage"
      - "--collector.replicasetstatus"
    expose:
      - "9216"
    healthcheck:
      test: ["CMD", "/mongodb_exporter", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - ayaka-network

  redis-exporter:
    image: "${REDIS_EXPORTER_IMAGE}"
    container_name: redis-exporter
    hostname: redis-exporter
    restart: always
    environment:
      REDIS_ADDR: "redis://redis:6379"
    expose:
      - "9121"
    healthcheck:
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - ayaka-network

  node-exporter:
    image: "${NODE_EXPORTER_IMAGE}"
    container_name: node-exporter
    hostname: node-exporter
    restart: always
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/host"
      - "--path.sysfs=/host/sys"
    expose:
      - "9100"
    volumes:
      - /:/host:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/metrics"]
      start_period: 15s
      interval: 30s
      retries: 5
      timeout: 5s
    networks:
      - ayaka-network

  prometheus:
    image: "${PROMETHEUS_IMAGE}"
    container_name: prometheus
    hostname: prometheus
    restart: always
    entrypoint: ["/bin/prometheus"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
      - "--web.enable-lifecycle"
    volumes:
      - "${AYAKALEA_TOOLKIT_ROOT}/lib/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "${AYAKALEA_TOOLKIT_ROOT}/lib/monitoring/prometheus/prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml:ro"
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_LISTEN_IP}:${PROMETHEUS_PORT}:9090"
    depends_on:
      mongodb-exporter-probe:
        condition: service_healthy
      redis-exporter-probe:
        condition: service_healthy
      instance-sensor:
        condition: service_healthy
      node-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    networks:
      - ayaka-network

  grafana:
    image: "${GRAFANA_IMAGE}"
    container_name: grafana
    hostname: grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in config/overleaf.rc}"
      GF_SECURITY_ADMIN_EMAIL: "admin@localhost"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_USERS_SIGNUP_ENABLED: "false"
      GF_SERVER_ROOT_URL: "http://localhost:${GRAFANA_PORT}/"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_LIVE_MAX_CONNECTIONS: "100"
    volumes:
      - "${AYAKALEA_TOOLKIT_ROOT}/lib/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "${AYAKALEA_TOOLKIT_ROOT}/lib/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro"
      - "${AYAKALEA_TOOLKIT_ROOT}/lib/monitoring/grafana/no-lokiexplore:/var/lib/grafana/plugins/grafana-lokiexplore-app:ro"
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_LISTEN_IP}:${GRAFANA_PORT}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - ayaka-network

networks:
  ayaka-network:
    external: true

volumes:
  prometheus-data:
  grafana-data:
