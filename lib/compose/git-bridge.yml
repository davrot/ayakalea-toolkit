---
services:
  git-bridge:
    image: "${GIT_BRIDGE_IMAGE}"
    container_name: git-bridge
    hostname: git-bridge
    restart: always
    volumes:
      - "${GIT_BRIDGE_DATA_PATH}:/data/git-bridge:z"
    expose:
      - "8000"
    environment:
      GIT_BRIDGE_API_BASE_URL: "http://ayakalea:3000/api/v0/"
      GIT_BRIDGE_OAUTH2_SERVER: "http://ayakalea"
      GIT_BRIDGE_POSTBACK_BASE_URL: "http://git-bridge:8000"
      GIT_BRIDGE_ROOT_DIR: "/data/git-bridge"
      LOG_LEVEL: "${GIT_BRIDGE_LOG_LEVEL}"
    user: root
    command: ["/server-pro-start.sh"]
    healthcheck:
      # /status is git-bridge's liveness route (200 'ok')
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ayaka-network

  ayakalea:
    depends_on:
      git-bridge:
        condition: service_healthy

networks:
  ayaka-network:
    external: true
