---
services:
  redis:
    image: "${REDIS_IMAGE}"
    container_name: redis
    hostname: redis
    restart: always
    # --appendonly yes is added by the toolkit when REDIS_AOF_PERSISTENCE=true
    command: "${REDIS_COMMAND}"
    volumes:
      - "${REDIS_DATA_PATH}:/data:z"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    environment:
      REDIS_AOF_PERSISTENCE: "${REDIS_AOF_PERSISTENCE}"
    networks:
      - ayaka-network

  ayakalea:
    depends_on:
      redis:
        condition: service_healthy

networks:
  ayaka-network:
    external: true
